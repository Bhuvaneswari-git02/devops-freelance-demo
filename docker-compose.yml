services:

  app:
    build:
      context: ./app
    container_name: freelance_app
    restart: unless-stopped
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    container_name: freelance_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app